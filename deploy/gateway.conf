upstream order_api {
    zone order_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server api-a:8000 resolve max_fails=1 fail_timeout=3s;
    server api-b:8000 resolve max_fails=1 fail_timeout=3s;
}
map $uri $safe_route {
    default other;
    / static;
    /operaciones operations;
    /api/session session;
    /api/auth/login login;
    /api/auth/logout logout;
    /api/auth/session session;
    /api/live live;
    /api/ready ready;
    /api/ops/summary ops-summary;
    /api/orders orders;
    ~^/api/orders/ order-detail;
}
log_format orders '$request_method $safe_route status=$status seconds=$request_time upstream=$upstream_addr upstream_status=$upstream_status';
server {
    listen 80;
    include /etc/nginx/vayxer/routes.inc;
}
